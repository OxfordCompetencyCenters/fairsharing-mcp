[project]
name = "fairsharing-mcp"
version = "0.1.0"
description = "MCP server for FAIRsharing API - access data standards, databases, and policies in life sciences research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "FAIRsharing MCP Contributors"}
]
keywords = ["mcp", "fairsharing", "fair", "data-standards", "databases", "policies", "life-sciences"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # Upper bound is deliberate: mcp 2.x is a new major line with API changes, and an
    # unbounded floor meant a fresh `pip install` could silently pull it on deploy.
    "mcp[cli]>=1.28.1,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
    "python-dotenv>=1.2.2",
]

[tool.uv]
# Security floors for TRANSITIVE dependencies (all reached via mcp). These are not
# packages this project imports, so they are constraints rather than dependencies —
# they raise the minimum without claiming a direct relationship.
#
# Each floor is the "first patched version" from a GitHub advisory; removing one
# re-opens the corresponding Dependabot alert. Re-verify with the protocol-level
# check in the repo notes (stdio + streamable-http) before relaxing anything.
constraint-dependencies = [
    "starlette>=1.3.1",          # UNC-path SSRF, form() limits ignored, Host validation
    "cryptography>=48.0.1",      # bundled OpenSSL, subgroup validation, buffer overflow
    "pyjwt>=2.13.0",             # JWK-as-HMAC forgery, alg allow-list bypass, DoS
    "python-multipart>=0.0.31",  # header/preamble DoS, quadratic querystring parsing
    "pydantic-settings>=2.14.2", # symlink traversal in NestedSecretsSettingsSource
    "idna>=3.15",                # DoS on crafted internationalised domain names
    "pygments>=2.20.0",          # ReDoS
]

[project.scripts]
fairsharing-mcp = "fairsharing_mcp.server:main"

[project.urls]
Homepage = "https://github.com/fairsharing/fairsharing-mcp"
Documentation = "https://github.com/fairsharing/fairsharing-mcp#readme"
Repository = "https://github.com/fairsharing/fairsharing-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fairsharing_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = ["fairsharing_mcp"]
