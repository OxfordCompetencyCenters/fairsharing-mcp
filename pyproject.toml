[project]
name = "fairsharing-mcp"
version = "0.1.0"
description = "MCP server for FAIRsharing API - access data standards, databases, and policies in life sciences research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "FAIRsharing MCP Contributors"}
]
keywords = ["mcp", "fairsharing", "fair", "data-standards", "databases", "policies", "life-sciences"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
fairsharing-mcp = "fairsharing_mcp.server:main"

[project.urls]
Homepage = "https://github.com/fairsharing/fairsharing-mcp"
Documentation = "https://github.com/fairsharing/fairsharing-mcp#readme"
Repository = "https://github.com/fairsharing/fairsharing-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fairsharing_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = ["fairsharing_mcp"]
